name: Sync Main To Feature Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-features
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - feature/db
          - feature/lms
          - feature/tahfiz
          - feature/finance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into ${{ matrix.branch }}
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_BRANCH="${{ matrix.branch }}"
          MERGE_MESSAGE="chore(sync): merge main into ${TARGET_BRANCH}"
          WORKFLOW_DIR=".github/workflows"

          git fetch origin
          git checkout "${TARGET_BRANCH}"

          # Never auto-resolve conflicts here. Preferring either side silently
          # drops the other side's code (this once removed imports from
          # feature/lms and broke the exam list in production).
          if ! git merge origin/main --no-ff --no-commit; then
            CONFLICTED="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            echo "::error::main conflicts with ${TARGET_BRANCH}; resolve manually. Files: $(echo ${CONFLICTED})"
            {
              echo "### main -> ${TARGET_BRANCH}: manual merge required"
              echo "${CONFLICTED}" | sed 's/^/- /'
            } >> "${GITHUB_STEP_SUMMARY}"

            if [ -z "$(gh pr list --base "${TARGET_BRANCH}" --head main --state open --json number --jq '.[].number')" ]; then
              gh pr create --base "${TARGET_BRANCH}" --head main \
                --title "Sync main into ${TARGET_BRANCH} (conflicts)" \
                --body "Automatic sync stopped because these files conflict:"$'\n\n'"$(echo "${CONFLICTED}" | sed 's/^/- /')"$'\n\n'"Merge main into ${TARGET_BRANCH} locally, keep both sides' changes, and push." \
                || echo "::warning::Could not open a pull request; resolve the merge locally."
            fi
            exit 1
          fi

          # Keep workflow files from the target branch. GITHUB_TOKEN cannot push
          # workflow changes, so workflow updates are pushed to every branch by hand.
          if [ -d "${WORKFLOW_DIR}" ]; then
            git checkout HEAD -- "${WORKFLOW_DIR}"
            git add "${WORKFLOW_DIR}"
          fi

          if git diff --cached --quiet; then
            echo "No syncable changes for ${TARGET_BRANCH}"
            git merge --abort 2>/dev/null || true
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "${MERGE_MESSAGE}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Validate merged code
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix client
          node --check server/router/registerApiRoutes.js
          node --input-type=module -e "await import('./server/router/registerApiRoutes.js'); process.exit(0)"
          node scripts/ci/check-undefined-identifiers.js

      - name: Push ${{ matrix.branch }}
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:${{ matrix.branch }}"
